<!DOCTYPE html>
<html>
<head>
    <title>My Kindness Garden</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Kindness Garden</h1>
        <p><i>Kind words grow into beautiful friendships.</i></p>
    </header>

    <hr>

    <div class="garden">

        <div class="flower">
            <div class="emoji">&#127803;</div>
            <h2>Be Kind</h2>
            <p>
                A <b>kind smile</b> can make someone happy.
            </p>
        </div>

        <div class="flower">
            <div class="emoji">&#127804;</div>
            <h2>Be Helpful</h2>
            <p>
                Helping others makes the world
                <span>more beautiful.</span>
            </p>
        </div>

        <div class="flower">
            <div class="emoji">&#127802;</div>
            <h2>Be Cheerful</h2>
            <p>
                <i>Share happiness wherever you go!</i>
            </p>
        </div>

    </div>

    <button>Spread Kindness</button>

    <footer>
        <p>Plant kindness and watch it grow!</p>
    </footer>

</body>
</html>
